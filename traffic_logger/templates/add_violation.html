{% extends "base.html" %}
{% block title %}Add Violation{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header card-header-signal"><i class="fa-solid fa-triangle-exclamation me-1"></i> Log a New Violation</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Vehicle Number</label>
            <input type="text" name="vehicle_number" class="form-control text-uppercase" placeholder="e.g. KA01AB1234" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Violation Type</label>
            <select name="violation_type" class="form-select" required>
              <option value="" disabled selected>Select violation type</option>
              {% for t in violation_types %}
              <option value="{{ t }}">{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" placeholder="e.g. MG Road Junction" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" name="violation_date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Fine Amount (₹)</label>
              <input type="number" step="0.01" min="0" name="fine_amount" class="form-control" placeholder="e.g. 500" required>
            </div>
          </div>
          <button type="submit" class="btn btn-signal-red w-100"><i class="fa-solid fa-floppy-disk me-1"></i> Save & Generate Challan</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
